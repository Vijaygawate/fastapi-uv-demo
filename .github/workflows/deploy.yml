name: Build and Deploy FastAPI (Prebuilt Artifact)

on:
  push:
    branches:
      - main

env:
  PYTHON_VERSION: "3.11"
  AZURE_WEBAPP_NAME: test-dpr-fastapi

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: |
          uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv sync --no-dev


      - name: Build deployment folder
        run: |
          mkdir deploy

          cp -r app deploy/
          cp pyproject.toml deploy/
          cp uv.lock deploy/

          cp -r .venv deploy/antenv

      - name: Zip artifact
        run: |
          cd deploy
          zip -r ../release.zip .

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: release.zip
          startup-command: /home/site/wwwroot/antenv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}
