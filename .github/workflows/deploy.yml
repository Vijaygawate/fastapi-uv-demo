name: Build and Deploy FastAPI to Azure App Service

on:
  push:
    branches:
      - main

env:
  PYTHON_VERSION: "3.11"          # Match App Service runtime
  AZURE_WEBAPP_NAME: test-dpr-fastapi
  PACKAGE_PATH: .
  STARTUP_COMMAND: python3 -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: |
          uv python install ${{ env.PYTHON_VERSION }}

      - name: Export dependencies
        run: |
          uv export \
            --format requirements-txt \
            --no-dev \
            --output-file requirements.txt

      - name: Install production dependencies
        run: |
          mkdir -p .python_packages/lib/site-packages

          uv pip install \
            --python $(uv python find ${{ env.PYTHON_VERSION }}) \
            --requirements requirements.txt \
            --target .python_packages/lib/site-packages

      - name: Verify packages
        run: |
          PYTHONPATH=.python_packages/lib/site-packages \
          python3 -c "import fastapi,uvicorn; print('Dependencies OK')"

      - name: Remove temporary requirements
        run: rm requirements.txt

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.PACKAGE_PATH }}
          startup-command: ${{ env.STARTUP_COMMAND }}
