name: Build and Deploy FastAPI

on:
  push:
    branches:
      - main

env:
  PYTHON_VERSION: "3.11"
  AZURE_WEBAPP_NAME: test-dpr-fastapi

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: |
          uv python install ${{ env.PYTHON_VERSION }}

      - name: Create Production Virtual Environment
        run: |
          uv venv antenv

          source antenv/bin/activate

          uv sync --no-dev

      - name: Verify Installation
        run: |
          source antenv/bin/activate

          python --version

          which python

          python -c "import fastapi"
          python -c "import uvicorn"
          python -c "import pydantic_core"

      - name: Remove cache
        run: |
          rm -rf .venv
          rm -rf ~/.cache/uv

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: .
          startup-command: python3 -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}
