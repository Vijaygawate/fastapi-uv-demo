name: Build and Deploy Python App to Azure App Service

on:
  push:
    branches:
      - main

env:
  AZURE_WEBAPP_NAME: test-dpr-fastapi
  PYTHON_VERSION: "3.11"
  PACKAGE_PATH: "."
  STARTUP_COMMAND: "python3 -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        run: |
          uv python install ${{ env.PYTHON_VERSION }}

      - name: Export Requirements
        run: |
          uv export \
            --format requirements-txt \
            --no-dev \
            -o requirements.txt

      - name: Install Dependencies into .python_packages
        run: |
          mkdir -p .python_packages/lib/site-packages

          uv pip install \
            --python $(uv python find ${{ env.PYTHON_VERSION }}) \
            --requirements requirements.txt \
            --target .python_packages/lib/site-packages


      - name: Remove Temporary Requirements
        run: |
          rm requirements.txt

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.PACKAGE_PATH }}
          startup-command: ${{ env.STARTUP_COMMAND }}

      - name: Logout
        if: always()
        run: az logout
