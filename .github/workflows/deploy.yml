name: Build and Deploy FastAPI (Prebuilt Artifact)

on:
  push:
    branches:
      - main

env:
  PYTHON_VERSION: "3.11"
  AZURE_WEBAPP_NAME: test-dpr-fastapi

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync production dependencies
        run: |
          uv sync --no-dev

      - name: Verify application
        run: |
          .venv/bin/python --version
          .venv/bin/python -c "from app.main import app; print('Application imports successfully')"

      - name: Prepare deployment artifact
        run: |
          mkdir deploy

          cp -r app deploy/
          cp pyproject.toml deploy/
          cp uv.lock deploy/

          # Azure App Service expects this name
          cp -r .venv deploy/antenv

      - name: Create ZIP package
        run: |
          cd deploy
          zip -r ../release.zip .

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: release.zip
          startup-command: python3 -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}
